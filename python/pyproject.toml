[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cred-protocol"
version = "0.2.0"
description = "Python SDK for the Cred Protocol trust evaluation API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://credprotocol.com"
Documentation = "https://docs.credprotocol.com/sdks/python"
Repository = "https://github.com/credprotocol/cred-sdk"
Issues = "https://github.com/credprotocol/cred-sdk/issues"

[project.optional-dependencies]
fastapi = ["fastapi>=0.110.0"]
# Know Your Agent hooks for x402 sellers (cred_protocol.kya)
x402 = ["x402>=2.25.0,<3"]

[dependency-groups]
# Ranges, not pins: uv.lock pins the versions, and Dependabot can only move
# pytest and pytest-asyncio together when neither is pinned exactly.
dev = [
    "pytest>=8.3.5,<9",
    "pytest-asyncio>=0.24.0,<1.5",
    "x402>=2.25.0,<3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["cred_protocol"]
