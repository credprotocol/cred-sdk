version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
      day: sunday
    ignore:
      # TypeScript 7 is the native compiler; tsup's declaration build calls the
      # JavaScript compiler API it no longer ships (see PR #5). Remove once
      # tsup, or our declaration build, supports TypeScript 7.
      - dependency-name: typescript
        versions: [">=7.0.0"]
    groups:
      typescript-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
      day: sunday
    groups:
      python-minor-patch:
        update-types: [minor, patch]
